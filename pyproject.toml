[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iot-telemetry-routing"
version = "0.1.0"
description = "IoT Hub message routing to Event Hubs, an Azure Functions alert pipeline, raw archive, and device presence."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[project.scripts]
opsctl = "service.cli:console"

[tool.setuptools]
packages = ["device", "service"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["device", "service", "pipeline", "function_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "functions"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
